[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccspy"
version = "0.1.0"
description = "Claude Code session token-usage analytics TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.89.0",
    "typer>=0.12.0",
    "pydantic>=2.10",
    "rich>=13.0",
]

[project.scripts]
ccspy = "ccspy.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
